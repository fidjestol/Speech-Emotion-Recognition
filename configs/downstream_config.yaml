# Emotion2Vec downstream SER configuration.
# Provide either:
# 1. explicit `embedding_path` columns in each split CSV, or
# 2. IEMOCAP-style `path` columns plus `embeddings_root`, which will map
#    `SessionX/.../utterance.wav` -> `<embeddings_root>/SessionX/.../utterance.pt`

train_csv: datasets/IEMOCAP/splits/iemocap_emotion2vec_base_6way_train.csv
val_csv: datasets/IEMOCAP/splits/iemocap_emotion2vec_base_6way_val.csv
test_csv: datasets/IEMOCAP/splits/iemocap_emotion2vec_base_6way_test.csv

output_dir: Emotion2Vec/artifacts
run_name: null
device: auto
seed: 42

label_col: emotion
embedding_path_col: embedding_path
audio_path_col: path
sample_id_col: null
embeddings_root: extracted_features/emotion2vec_base/frame
embedding_suffix: .pt

embedding_dim: 768
hidden_dim: 256

epochs: 30
batch_size: 32
eval_batch_size: 64
learning_rate: 0.001
weight_decay: 0.0001
optimizer: adamw
lr_scheduler: reduce_on_plateau
lr_scheduler_patience: 2
lr_scheduler_factor: 0.5
lr_scheduler_min_lr: 1.0e-6
gradient_clip_norm: 1.0
num_workers: 2
pin_memory: true

max_train_samples: null
max_val_samples: null
max_test_samples: null
resume_from_checkpoint: null
early_stopping_patience: null
early_stopping_min_delta: 0.0

report_to: wandb
wandb_project: emotion2vec-downstream-ser
wandb_entity: null
wandb_group: null
wandb_tags: emotion2vec,downstream,iemocap,6way
wandb_mode: online
wandb_watch_model: false

save_figures: true
save_predictions: true

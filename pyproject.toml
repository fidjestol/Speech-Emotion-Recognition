[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
requires-python = ">=3.10"
name = "speech-emotion-recognition"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
dependencies = [
    "scikit-learn>=1.7.2",
    "librosa>=0.11.0",
    "numpy>=2.2.6",
    "matplotlib>=3.9.0",
    "opensmile>=2.6.0",
    "praat-parselmouth>=0.4.7",
    "scipy>=1.15.3",
    "soundfile>=0.13.1",
    "speechbrain>=1.0.3",
    "torch>=2.10.0",
    "torchaudio>=2.10.0",
    "datasets[audio]>=4.5.0",
    "huggingface-hub>=0.36.0",
    "pandas>=2.3.3",
    "nbconvert[webpdf]>=7.17.0",
    "protobuf>=6.33.5",
    "tensorboard>=2.19.0",
    "transformers>=5.0.0",
    "wandb>=0.23.0",
    "accelerate>=1.1.0",
    "ipywidgets>=8.1.8",
    "pandas-stubs~=2.3.3",
    "seaborn>=0.13.2",
    "xgboost>=3.1.1",
    "catboost>=1.2.8",
]

[dependency-groups]
dev = [
    "comm>=0.2.3",
    "ipykernel>=7.1.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform != 'darwin'" },
]
torchaudio = [
    { index = "pytorch-cu128", marker = "sys_platform != 'darwin'" },
]

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
include = ["utils", "inspections"]
